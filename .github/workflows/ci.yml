name: Launcher checks

on:
  push:
    branches: [main, 'next-*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        shell: pwsh
        run: |
          [xml]$taskProject = Get-Content LauncherVersion.props
          $taskVersion = @($taskProject.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          ./build.ps1 -Version $taskVersion
