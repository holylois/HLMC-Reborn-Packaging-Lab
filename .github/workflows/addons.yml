name: Add-on build and tests

on:
  push:
    branches: [main, 'next-*']
    paths: ['addons/**', '.github/workflows/addons.yml']
  pull_request:
    paths: ['addons/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addons:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test private client file preparation
        run: |
          python3 test-fetch-client-files.py
          python3 test-wait-test-server.py
      - name: Cache locked mod jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: addons/.deps
          key: deps-${{ hashFiles('addons/deps.lock.json') }}
      - name: Fetch locked mod jars (hash-verified)
        run: python3 fetch-deps.py
      # The live radio test needs real internet streams; it runs locally before releases instead.
      - name: Build and run every add-on test
        run: ./gradlew build -PskipNetworkTests --console=plain
      # Extras mixins are optional (defaultRequire 0) and fail silently at runtime; this fails the build instead.
      - name: Check every mixin target exists in the shipped jars
        run: |
          python3 test-mixin-source.py
          python3 check-mixin-targets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holylois-addons
          path: addons/*/build/libs/*.jar
          retention-days: 14
